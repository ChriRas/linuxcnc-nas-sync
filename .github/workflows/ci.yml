name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y rsync shellcheck
      - name: shellcheck
        run: shellcheck -x -S warning bin/nc-sync bin/config-backup lib/common.sh install.sh tests/*.sh
      - name: Python syntax
        run: python3 -m py_compile lib/lcnc-idle.py tests/sim-states.py
      - name: Offline tests
        run: tests/nc-sync-test.sh && tests/config-backup-test.sh
